{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Взлом протокола</title>
    <style>
        .game-layout {
            display: flex;
            align-items: flex-start;
            gap: 2rem;
            flex-wrap: wrap;
        }
    </style>
    <script src="{% static 'breach_protocol/js/game.js' %}" defer></script>
</head>
<body>
    <main>
        <h1>Взлом протокола</h1>

        <section aria-labelledby="game-heading">
            <h2 id="game-heading">Матрица кода</h2>
            <p>Время: <output id="timer">—</output></p>

            <div class="game-layout">
                <div>
                    <div id="code-matrix" aria-label="Матрица кода"></div>
                    <p>
                        <button id="reset-buffer" type="button" disabled>Сбросить буфер</button>
                    </p>
                </div>

                <aside aria-label="Буфер и комбинации">
                    <h3>Буфер</h3>
                    <output id="buffer">—</output>
                    <h3>Комбинации</h3>
                    <ol id="target-sequences"></ol>
                </aside>
            </div>
        </section>

        <form id="game-settings">
            <h2>Настройки</h2>
            <p>
                <label for="grid-size">Размер сетки:</label>
                <input id="grid-size" name="grid-size" type="number" min="3" max="10" value="5" required>
            </p>
            <p>
                <label for="sequence-count">Количество последовательностей:</label>
                <input id="sequence-count" name="sequence-count" type="number" min="1" max="6" value="3" required>
            </p>
            <p>
                <label for="sequence-length">Максимальная длина последовательности:</label>
                <input id="sequence-length" name="sequence-length" type="number" min="2" max="8" value="4" required>
            </p>
            <p>
                <label for="symbol-count">Количество различных символов:</label>
                <input id="symbol-count" name="symbol-count" type="number" min="2" max="25" value="5" required>
            </p>
            <p>
                <label for="time-limit">Максимальное время игры, секунд:</label>
                <input id="time-limit" name="time-limit" type="number" min="1" max="3600" value="60" required>
            </p>
            <button type="submit">Сгенерировать</button>
            <button id="reset-timer" type="button" disabled>Сбросить таймер</button>
        </form>
    </main>
</body>
</html>
